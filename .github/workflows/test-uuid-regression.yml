name: 🧪 Test non-régression ROOT_UUID (Arch, Fedora, Void)

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, fedora, void]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer le script depuis le code source actuel
        run: |
          npm ci
          npx tsx scripts/dump-disk.ts ${{ matrix.distro }}
          cat scripts/generated-${{ matrix.distro }}-disk.sh

      - name: Exécuter le script généré
        run: sudo bash scripts/generated-${{ matrix.distro }}-disk.sh

      - name: Boot réel via QEMU (BIOS, série) et recherche d'un prompt de login
        run: |
          sudo apt-get install -y qemu-system-x86 || true
          IMG=$(find dist -name '*.img' | head -1)
          echo "Image: $IMG"
          timeout 90 sudo qemu-system-x86_64 -enable-kvm -cpu host -m 1536 \
            -drive file="$IMG",format=raw \
            -nographic -serial file:/tmp/serial.log -display none \
            || echo "QEMU s'est arrêté (timeout attendu ou fin de boot)"
          echo "=== dernières lignes de la console série ==="
          tail -n 150 /tmp/serial.log || echo "ECHEC: pas de log série"
          grep -qi "login:" /tmp/serial.log && echo "✅ PROMPT DE LOGIN ATTEINT (${{ matrix.distro }})" || echo "❌ Pas de prompt de login détecté (${{ matrix.distro }})"
