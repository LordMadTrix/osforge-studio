name: 🧪 Test disque Rocky Linux (script réellement généré par OSForge)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer le script depuis le code source actuel
        run: |
          npm ci
          npx tsx scripts/dump-rocky-disk.ts
          cat scripts/generated-rocky-disk.sh

      - name: Exécuter le script généré (bootstrap dnf + partitionnement + GRUB)
        run: sudo bash scripts/generated-rocky-disk.sh

      - name: Vérifier le contenu de l'image avant boot
        run: |
          sudo losetup -P -f dist/diskforgerocky-1.0-x86_64.img
          LOOPDEV=$(losetup -j dist/diskforgerocky-1.0-x86_64.img | cut -d: -f1)
          sudo mkdir -p /mnt/rockytest
          sudo mount "${LOOPDEV}p1" /mnt/rockytest
          echo "=== /etc/os-release ==="
          cat /mnt/rockytest/etc/os-release || echo "ECHEC: pas d'os-release"
          echo "=== présence du noyau ==="
          ls /mnt/rockytest/boot/ | grep vmlinuz || echo "ECHEC: pas de vmlinuz"
          echo "=== utilisateur forge ==="
          grep forge /mnt/rockytest/etc/passwd || echo "ECHEC: utilisateur forge absent"
          sudo umount /mnt/rockytest
          sudo losetup -d "$LOOPDEV"

      - name: Vérifier que KVM est disponible
        run: |
          ls -la /dev/kvm || echo "PAS de /dev/kvm"
          sudo apt-get install -y qemu-system-x86 || true

      - name: Boot réel via QEMU (BIOS, série) et recherche d'un prompt de login
        run: |
          timeout 90 sudo qemu-system-x86_64 -enable-kvm -m 1536 \
            -drive file=dist/diskforgerocky-1.0-x86_64.img,format=raw \
            -nographic -serial file:/tmp/serial.log -display none \
            || echo "QEMU s'est arrêté (timeout attendu ou fin de boot)"
          echo "=== dernières lignes de la console série ==="
          tail -n 100 /tmp/serial.log || echo "ECHEC: pas de log série"
          grep -qi "login:" /tmp/serial.log && echo "✅ PROMPT DE LOGIN ATTEINT" || echo "❌ Pas de prompt de login détecté"
