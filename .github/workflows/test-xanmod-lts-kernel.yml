name: 🧪 Test noyau XanMod LTS reel pour Debian

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer le script depuis le code source actuel
        run: |
          npm ci
          mkdir -p scripts
          cat > scripts/dump-debian-xanmod.ts <<'EOF'
          import { generateBuildScript } from '../src/services/scriptGenerators';
          import type { OSRecipe } from '../src/types/os';
          import { writeFileSync } from 'node:fs';

          const recipe: OSRecipe = {
            distro: 'debian',
            arch: 'x86_64',
            hostname: 'diskforge-xanmod',
            timezone: 'Europe/Paris',
            locale: 'fr_FR',
            outputFormat: 'iso',
            kernel: 'lts',
            branding: { osName: 'DiskForgeXanmod', editionName: 'Test', version: '1.0' },
            user: { username: 'forge', fullName: 'Forge', shell: '/bin/bash', sudo: true, password: 'forge', sshPublicKey: '' },
            enableSSH: false,
            selectedPackages: [],
            customPackages: [],
            security: { firewall: 'none' },
            firstBootScript: '',
          } as unknown as OSRecipe;

          const script = generateBuildScript(recipe);
          writeFileSync('scripts/generated-debian-xanmod.sh', script);
          console.log('written scripts/generated-debian-xanmod.sh, length', script.length);
          EOF
          npx tsx scripts/dump-debian-xanmod.ts

      - name: Exécuter le script généré (bootstrap Debian réel + noyau XanMod LTS)
        run: set -o pipefail; sudo bash scripts/generated-debian-xanmod.sh 2>&1 | tee /tmp/build.log

      - name: Extraire le noyau embarqué dans l'ISO produite et vérifier qu'il s'agit bien de XanMod
        run: |
          sudo apt-get install -y xorriso >/dev/null 2>&1 || true
          ISO=$(find dist -name "*.iso" | head -n1)
          echo "ISO trouvée: $ISO"
          xorriso -indev "$ISO" -osirrox on -extract /live/vmlinuz /tmp/vmlinuz
          file /tmp/vmlinuz
          if file /tmp/vmlinuz | grep -qi "xanmod"; then
            echo "✅ Le noyau réellement embarqué dans l'ISO est bien un noyau XanMod"
          else
            echo "❌ Le noyau embarqué ne mentionne pas XanMod — le câblage n'a pas fonctionné"
            exit 1
          fi
