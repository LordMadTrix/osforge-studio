name: 🧪 Test Linux Mint (bootstrap réel + Cinnamon + Firefox)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer le script depuis le code source actuel
        run: |
          npm ci
          cat > dump-mint-tmp.ts << 'EOF'
          import { generateBuildScript } from './src/services/scriptGenerators';
          import { writeFileSync } from 'node:fs';
          const recipe = {
            distro: 'linuxmint', arch: 'x86_64', hostname: 'diskforge-mint',
            timezone: 'Europe/Paris', locale: 'fr_FR', outputFormat: 'wsl2_tar',
            branding: { osName: 'DiskForgeMint', editionName: 'Test', version: '1.0' },
            user: { username: 'forge', fullName: 'Forge', shell: '/bin/bash', sudo: true, password: 'forge', sshPublicKey: '' },
            enableSSH: false, selectedPackages: ['firefox', 'git'], customPackages: [],
            security: { firewall: 'none' }, firstBootScript: '',
          };
          writeFileSync('/tmp/generated-mint.sh', generateBuildScript(recipe));
          EOF
          npx tsx dump-mint-tmp.ts
          rm dump-mint-tmp.ts
          cat /tmp/generated-mint.sh

      - name: Exécuter le script généré (bootstrap réel + Firefox Mozilla repo)
        run: sudo bash /tmp/generated-mint.sh

      - name: Vérifier le rootfs produit
        run: |
          TAR=$(find dist -name '*rootfs.tar.gz')
          echo "Archive: $TAR"
          mkdir -p /tmp/mintcheck
          sudo tar -xzf "$TAR" -C /tmp/mintcheck ./etc/os-release ./usr/bin/firefox 2>&1 || true
          echo "=== os-release ==="
          cat /tmp/mintcheck/etc/os-release || echo "ECHEC: pas d'os-release"
          echo "=== firefox (doit venir du dépôt Mozilla, pas du stub snap) ==="
          ls -la /tmp/mintcheck/usr/bin/firefox || echo "ECHEC: firefox absent"
