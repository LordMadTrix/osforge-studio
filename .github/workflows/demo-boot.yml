name: 🚀 Démo — Démarrage d'un petit Linux (Alpine)

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer le script (Alpine Linux, image disque minimale)
        run: |
          npm ci
          npx tsx scripts/dump-demo.ts

      - name: Construire l'image (bootstrap réel Alpine)
        run: sudo bash scripts/generated-demo.sh

      - name: Démarrer réellement la machine virtuelle (QEMU + KVM)
        run: |
          sudo apt-get install -y qemu-system-x86 || true
          IMG=$(find dist -name '*.img')
          echo "Image: $IMG ($(du -h "$IMG" | cut -f1))"
          timeout 60 sudo qemu-system-x86_64 -enable-kvm -cpu host -m 512 \
            -drive file="$IMG",format=raw \
            -nographic -serial file:/tmp/console.log -display none \
            || echo "(arrêt normal après timeout de démonstration)"
          echo "================================================================"
          echo "  CONSOLE DE LA MACHINE VIRTUELLE (démarrage réel)"
          echo "================================================================"
          cat /tmp/console.log
